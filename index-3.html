<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academia Sabí — Professor Sabí</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f1f5fc;color:#17233b;line-height:1.55}header{background:linear-gradient(110deg,#133c85,#087f90);color:white;padding:24px;text-align:center}main{max-width:850px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:15px;box-shadow:0 3px 15px #1232}button{background:#165bd0;color:white;border:0;border-radius:9px;padding:11px;margin:5px;cursor:pointer}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #ccd5e3;border-radius:9px}textarea{min-height:100px}nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:6px;margin-bottom:16px}nav button{margin:0;background:#e5eefc;color:#143e84;font-weight:650}nav button:hover,nav button:focus{background:#c8dafa}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e6ad32;outline-offset:2px}button:disabled{opacity:.55} .card{overflow-wrap:anywhere} .card h2{color:#133c85} @media(max-width:520px){main{padding:10px}.card{padding:16px}header{padding:20px 10px}}.hidden{display:none}.muted{color:#637083}article{padding:10px;border-top:1px solid #ddd}footer{text-align:center;padding:20px}</style></head><body><header><h1>🎓 Academia Sabí</h1><p>Aprender • Partilhar • Conectar 🇲🇿</p><strong>👨🏾‍🏫 Professor Sabí • Plataforma educativa</strong></header><main><div id="status" role="status" aria-live="polite" style="padding:8px 0"></div><section id="auth" class="card"><h2>Entrar ou criar conta</h2><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" placeholder="E-mail"><label for="password">Palavra-passe</label><input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="Palavra-passe (mínimo 6 caracteres)"><button id="login">Entrar</button><button id="signup">Criar conta</button><button id="reset">Recuperar palavra-passe</button><p class="muted">Entra com a tua conta existente da Academia Sabí ou cria uma nova.</p></section><section id="app" class="hidden"><div class="card"><span id="identity"></span><button id="logout">Sair</button></div><nav id="nav"></nav><section id="content" class="card"></section></section></main><footer>© Academia Sabí • Professor Sabí 🇲🇿<br>Conteúdos educativos de treino • Não substituem os programas oficiais</footer><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';

import {getFirestore,collection,addDoc,onSnapshot,query,orderBy,limit,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
// Configuração do projeto Academia Sabí fornecida pelo proprietário.
const firebaseConfig={
  apiKey:'AIzaSyDselLooRI_OvtpT7Xy276zWZg0aJZH0Rc',
  authDomain:'academia-sabi.firebaseapp.com',
  projectId:'academia-sabi',
  storageBucket:'academia-sabi.firebasestorage.app',
  messagingSenderId:'123333240643',
  appId:'1:123333240643:web:6e00df3738a3ab0ce571f6',
  measurementId:'G-SMMC4303B7'
};
const $=id=>document.getElementById(id), status=t=>$('status').textContent=t;
let auth,db,user,unsubscribe;
const configured=Boolean(firebaseConfig.apiKey && firebaseConfig.projectId && firebaseConfig.appId);
if(configured){try{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,u=>{user=u;$('auth').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);if(u){$('identity').textContent=u.email;show('study')}else if(unsubscribe){unsubscribe();unsubscribe=null}})}catch(e){status('Erro de configuração: '+e.message)}}else status('Modo demonstração: adiciona as credenciais Firebase para ativar as contas. Podes explorar as ferramentas abaixo.');
const actions={login:()=>signInWithEmailAndPassword(auth,$('email').value,$('password').value),signup:()=>createUserWithEmailAndPassword(auth,$('email').value,$('password').value),reset:()=>sendPasswordResetEmail(auth,$('email').value),logout:()=>signOut(auth)};
Object.entries(actions).forEach(([id,fn])=>$(id).onclick=async()=>{if(!configured)return status('Configura primeiro o Firebase.');try{await fn();status(id==='reset'?'Verifica o teu e-mail.':'Operação concluída.')}catch(e){status('Não foi possível concluir: '+({'auth/invalid-credential':'E-mail ou palavra-passe incorretos.','auth/email-already-in-use':'Este e-mail já tem conta. Usa Entrar.','auth/weak-password':'Escolhe uma palavra-passe mais forte.','auth/unauthorized-domain':'Autoriza este domínio no Firebase Authentication.','auth/operation-not-allowed':'Ativa E-mail/Palavra-passe no Firebase Authentication.'}[e.code]||e.message))}});
if(!configured){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('identity').textContent='Modo demonstração';}
const tabs={study:'📚 Professor Sabí',translate:'🌐 Tradutor Sabí',languages:'🗣️ Línguas',exams:'📝 Exames',tools:'🎒 Kit do estudante',library:'📥 Biblioteca',wallet:'🎓 Carteira',community:'🌍 Comunidade',help:'❔ Ajuda'};
Object.entries(tabs).forEach(([key,label])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>show(key);$('nav').append(b)});
const langs={auto:'Detetar automaticamente',pt:'Português',en:'Inglês',fr:'Francês',es:'Espanhol',de:'Alemão',it:'Italiano',zh:'Chinês',ja:'Japonês',ko:'Coreano',ar:'Árabe',hi:'Hindi',ru:'Russo',sw:'Suaíli',af:'Africâner',tr:'Turco',nl:'Neerlandês',pl:'Polaco',uk:'Ucraniano',id:'Indonésio',vi:'Vietnamita',th:'Tailandês',he:'Hebraico',fa:'Persa',bn:'Bengali',ur:'Urdu',ta:'Tâmil',te:'Telugo',el:'Grego',sv:'Sueco',no:'Norueguês',da:'Dinamarquês',fi:'Finlandês',ro:'Romeno',cs:'Checo',hu:'Húngaro',bg:'Búlgaro',hr:'Croata',sr:'Sérvio',sk:'Eslovaco',sl:'Esloveno',lt:'Lituano',lv:'Letão',et:'Estónio',sq:'Albanês',az:'Azeri',ka:'Georgiano',hy:'Arménio',ms:'Malaio',fil:'Filipino',ne:'Nepalês',gu:'Guzerate',mr:'Marata',pa:'Panjabi',kn:'Canarim',ml:'Malaiala',my:'Birmanês',km:'Khmer',lo:'Lao',mn:'Mongol',zu:'Zulu',xh:'Xhosa',am:'Amárico',so:'Somali',yo:'Iorubá',ig:'Igbo',ha:'Hauçá',eu:'Basco',ca:'Catalão',gl:'Galego',is:'Islandês',ga:'Irlandês',cy:'Galês',mt:'Maltês',la:'Latim',eo:'Esperanto'};
const subjects=['Matemática','Português','Física','Química','Biologia','Inglês'];
const questions={Matemática:[['Quanto é 8 × 7?',['54','56','64'],1,'8 × 7 = 56.'],['Quanto é 1/2 + 1/4?',['3/4','2/6','1/8'],0,'Converte 1/2 em 2/4.'],['Quanto é 12²?',['24','124','144'],2,'12 × 12 = 144.'],['Resolve 2x = 18.',['x=9','x=16','x=36'],0,'Divide ambos os membros por 2.'],['Qual é a área de um quadrado de lado 5?',['10','20','25'],2,'Área = lado × lado.']],Português:[['Qual é um substantivo?',['Correr','Escola','Rapidamente'],1,'Escola nomeia um lugar.'],['Qual é o plural de papel?',['Papéis','Papels','Papeis'],0,'O plural correto é papéis.'],['Qual é o verbo?',['Bonito','Azul','Estudar'],2,'Estudar indica uma ação.'],['Qual palavra está acentuada corretamente?',['Lapis','Lápis','Lapís'],1,'Lápis tem acento na primeira sílaba.'],['Qual é um adjetivo?',['Alegre','Mesa','Andar'],0,'Alegre caracteriza um nome.']],Física:[['Unidade SI de velocidade?',['m/s','kg','s'],0,'Velocidade mede-se em metros por segundo.'],['Unidade de força?',['Joule','Newton','Watt'],1,'Força mede-se em newtons.'],['Velocidade = ?',['tempo/distância','massa/tempo','distância/tempo'],2,'v=d/t.'],['Unidade de tempo SI?',['Segundo','Hora','Dia'],0,'A unidade base é o segundo.'],['Qual é uma forma de energia?',['Volume','Cinética','Densidade'],1,'Energia cinética é a do movimento.']],Química:[['Símbolo da água?',['O2','CO2','H2O'],2,'Água é H2O.'],['Símbolo do oxigénio?',['O','Au','Fe'],0,'O representa oxigénio.'],['Número atómico do hidrogénio?',['2','1','8'],1,'Hidrogénio tem 1 protão.'],['pH neutro a 25 °C?',['0','14','7'],2,'Água pura tem pH próximo de 7.'],['Qual é um elemento químico?',['Ferro','Água','Sal'],0,'Ferro é o elemento Fe.']],Biologia:[['Unidade básica da vida?',['Átomo','Célula','Tecido'],1,'A célula é a unidade básica.'],['Onde ocorre a fotossíntese?',['Cloroplastos','Ribossomas','Núcleo'],0,'Ocorre nos cloroplastos.'],['Qual órgão bombeia sangue?',['Pulmão','Rim','Coração'],2,'O coração bombeia sangue.'],['Qual gás respiramos para obter energia?',['Azoto','Oxigénio','Hélio'],1,'Utilizamos oxigénio na respiração celular.'],['DNA transporta?',['Informação genética','Sangue','Oxigénio'],0,'O DNA contém informação genética.']],Inglês:[['Hello significa?',['Adeus','Olá','Obrigado'],1,'Hello = olá.'],['Thank you significa?',['Obrigado','Bom dia','Por favor'],0,'Thank you = obrigado.'],['Good morning significa?',['Boa noite','Até logo','Bom dia'],2,'Good morning = bom dia.'],['Book significa?',['Caneta','Livro','Escola'],1,'Book = livro.'],['I am a student significa?',['Sou estudante','Sou professor','Sou médico'],0,'I am a student = sou estudante.']]};
let currentExam=null;const storageKey=k=>'sabi_'+(user?.uid||'demo')+'_'+k;const get=k=>JSON.parse(localStorage.getItem(storageKey(k))||'[]');const save=(k,v)=>localStorage.setItem(storageKey(k),JSON.stringify(v));
function show(tab){if(unsubscribe){unsubscribe();unsubscribe=null}const c=$('content');c.replaceChildren();c.innerHTML=({study:`<h2>👨🏾‍🏫 Professor Sabí — Sala de aulas</h2><p>Aulas introdutórias da 1.ª à 12.ª classe. Não substituem os manuais escolares.</p><label>Classe</label><select id="grade"></select><label>Disciplina</label><select id="subject"></select><button id="open">Começar aula</button><div id="lesson"></div>`,translate:`<h2>🌐 Tradutor Sabí Pro</h2><p class="muted">Idiomas disponíveis dependem do serviço externo. Tradução requer internet; não introduzas dados confidenciais.</p><label>De</label><select id="src"></select><label>Para</label><select id="dst"></select><textarea id="source" placeholder="Escreve o texto"></textarea><button id="dictate">🎤 Ditar</button><button id="swap">⇄ Trocar</button><button id="translate">Traduzir</button><textarea id="translated" readonly placeholder="Tradução"></textarea><button id="speak">🔊 Ouvir</button><button id="copy">📋 Copiar</button><p id="translateMsg"></p>`,languages:`<h2>🗣️ Aulas de idiomas</h2><select id="langLesson"></select><div id="langContent"></div>`,exams:`<h2>📝 Exames de treino Sabí</h2><p>5 perguntas • Nota de 0 a 20 • Material demonstrativo</p><select id="examGrade"></select><select id="examSubject"></select><button id="startExam">Começar exame</button><div id="examBody"></div>`,tools:`<h2>🎒 Kit do estudante</h2><h3>Plano de estudos</h3><input id="task" placeholder="Tarefa"><input id="date" type="date"><button id="addTask">Adicionar</button><div id="tasks"></div><h3>📝 Apontamentos</h3><textarea id="notes" placeholder="Escreve os teus apontamentos"></textarea><button id="saveNotes">Guardar</button><h3>⏱️ Temporizador</h3><p id="clock">25:00</p><button id="startClock">Iniciar 25 minutos</button><button id="stopClock">Parar</button>`,library:`<h2>📥 Biblioteca Sabí</h2><p>Materiais introdutórios originais. Para descarregar os PDFs, adiciona os ficheiros correspondentes à pasta biblioteca do teu site.</p><div id="books"></div>`,wallet:`<h2>🎓 Carteira digital do estudante</h2><p>Registo local de avaliações de treino, sem validade oficial.</p><input id="studentName" placeholder="Nome do estudante"><button id="saveName">Guardar nome</button><div id="grades"></div><button id="export">Exportar dados JSON</button>`,help:`<h2>❔ Centro de ajuda</h2><p>Bem-vindo à Academia Sabí, uma plataforma educativa de treino criada pelo Professor Sabí.</p><h3>🔐 Não consigo entrar?</h3><p>Confirma o e-mail, usa Recuperar palavra-passe e verifica a tua ligação à internet.</p><h3>🌐 Tradutor</h3><p>Usa textos curtos e escolhe a língua de origem. O serviço externo pode não suportar todos os idiomas. Não envies informação privada.</p><h3>📚 Biblioteca</h3><p>Os ficheiros PDF só estarão disponíveis quando forem colocados na pasta biblioteca do repositório.</p><h3>📝 Resultados</h3><p>As notas são exercícios de treino, não documentos escolares oficiais. Exporta uma cópia dos dados na carteira.</p><h3>🛡️ Privacidade</h3><p>As contas são geridas pelo Firebase Authentication. Os resultados e apontamentos ficam neste navegador. Evita publicar dados pessoais na comunidade.</p>`,community:`<h2>🌍 Comunidade Sabí</h2><textarea id="postText" maxlength="1000" placeholder="Partilha uma ideia ou pergunta"></textarea><button id="postBtn">Publicar</button><div id="posts"></div>`})[tab];
if(tab==='help'){}
if(tab==='study'){fill('grade',Array.from({length:12},(_,i)=>[i+1,`${i+1}.ª classe`]));fill('subject',subjects);$('open').onclick=()=>{const s=$('subject').value,g=$('grade').value;$('lesson').innerHTML=`<h3>${s} — ${g}.ª classe</h3><p>Introdução e revisão: lê a pergunta, escolhe uma resposta e consulta a explicação.</p>`;quiz($('lesson'),s,1)}}
if(tab==='translate'){fill('src',Object.entries(langs));fill('dst',Object.entries(langs).filter(([k])=>k!=='auto'));$('src').value='pt';$('dst').value='en';$('swap').onclick=()=>{if($('src').value==='auto')return;[$('src').value,$('dst').value]=[$('dst').value,$('src').value]};$('translate').onclick=async()=>{const txt=$('source').value.trim();if(!txt)return;const out=$('translateMsg');out.textContent='A traduzir…';try{const sl=$('src').value,tl=$('dst').value;if(sl==='auto')throw Error('Seleciona o idioma de origem; a deteção automática não é suportada.');if(txt.length>450)throw Error('Máximo de 450 caracteres por tradução.');const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(txt)}&langpair=${encodeURIComponent((sl==='auto'?'pt':sl)+'|'+tl)}`);if(!r.ok)throw Error('Serviço indisponível');const j=await r.json();if(j.responseStatus!==200)throw Error(j.responseDetails||'Tradução indisponível');$('translated').value=j.responseData.translatedText;out.textContent='Tradução concluída. Confirma a precisão.'}catch(e){out.textContent='Erro: '+e.message}};$('speak').onclick=()=>speak($('translated').value,$('dst').value);$('copy').onclick=()=>navigator.clipboard.writeText($('translated').value).catch(()=>status('Não foi possível copiar.'));$('dictate').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return status('Ditado indisponível neste navegador.');const r=new R();r.lang=$('src').value==='auto'?'pt-PT':$('src').value;r.onresult=e=>$('source').value=e.results[0][0].transcript;r.start()}}
if(tab==='languages'){fill('langLesson',Object.entries(langs).filter(([k])=>k!=='auto'));$('langLesson').value='en';const update=()=>{const code=$('langLesson').value,examples=[['Olá','Hello'],['Obrigado','Thank you'],['Bom dia','Good morning']];$('langContent').replaceChildren();examples.forEach(([pt,en])=>{const a=document.createElement('article');a.textContent=code==='en'?`${pt} — ${en}`:`${pt} — pratica a tradução e a pronúncia`;const b=document.createElement('button');b.textContent='🔊 Ouvir';b.onclick=()=>speak(code==='en'?en:pt,code);a.append(b);$('langContent').append(a)})};$('langLesson').onchange=update;update()}
if(tab==='exams'){fill('examGrade',Array.from({length:12},(_,i)=>[i+1,`${i+1}.ª classe`]));fill('examSubject',subjects);$('startExam').onclick=()=>{currentExam={grade:$('examGrade').value,subject:$('examSubject').value};const b=$('examBody');b.replaceChildren();questions[currentExam.subject].forEach((q,i)=>{const p=document.createElement('article');p.textContent=`${i+1}. ${q[0]}`;q[1].forEach((opt,j)=>{const label=document.createElement('label');const inp=document.createElement('input');inp.type='radio';inp.name='q'+i;inp.value=j;label.append(inp,document.createTextNode(' '+opt));p.append(label)});b.append(p)});const btn=document.createElement('button');btn.textContent='Corrigir exame';btn.onclick=()=>{let correct=0;const detail=[];questions[currentExam.subject].forEach((q,i)=>{const selected=b.querySelector(`input[name="q${i}"]:checked`);if(selected&&Number(selected.value)===q[2])correct++;detail.push(`${i+1}. ${q[3]}`)});const score=correct*4;const history=get('grades');history.unshift({...currentExam,score:score,date:new Date().toLocaleString('pt-PT')});save('grades',history);b.replaceChildren();const p=document.createElement('p');p.textContent=`Nota: ${score}/20. ${correct} de 5 respostas certas. ${detail.join(' ')}`;b.append(p)};b.append(btn)}}
if(tab==='tools'){const render=()=>{$('tasks').replaceChildren();get('tasks').forEach(t=>{const p=document.createElement('p');p.textContent=`${t.date||'Sem data'} — ${t.name}`;$('tasks').append(p)})};render();$('addTask').onclick=()=>{if(!$('task').value.trim())return;save('tasks',[...get('tasks'),{name:$('task').value,date:$('date').value}]);$('task').value='';render()};$('notes').value=localStorage.getItem(storageKey('notes'))||'';$('saveNotes').onclick=()=>{localStorage.setItem(storageKey('notes'),$('notes').value);status('Apontamentos guardados neste dispositivo.')};let timer=null,remaining=1500;$('startClock').onclick=()=>{if(timer)return;timer=setInterval(()=>{remaining--;const m=Math.floor(remaining/60),s=remaining%60;$('clock').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(remaining<=0){clearInterval(timer);timer=null;remaining=1500;status('Sessão terminada!')}},1000)};$('stopClock').onclick=()=>{clearInterval(timer);timer=null}} 
if(tab==='library'){['matematica','portugues','fisica','quimica','biologia','ingles','tecnicas_de_estudo'].forEach(s=>{const p=document.createElement('article');const a=document.createElement('a');a.href=`biblioteca/${s}_introducao.pdf`;a.textContent=`📄 ${s.replaceAll('_',' ')} — abrir PDF`;a.target='_blank';a.rel='noopener';p.append(a);$('books').append(p)})}
if(tab==='wallet'){$('studentName').value=localStorage.getItem(storageKey('name'))||'';$('saveName').onclick=()=>{localStorage.setItem(storageKey('name'),$('studentName').value);status('Nome guardado.')};$('grades').replaceChildren();get('grades').forEach(g=>{const p=document.createElement('p');p.textContent=`${g.date} — ${g.subject} (${g.grade}.ª classe): ${g.score}/20`;$('grades').append(p)});$('export').onclick=()=>{const data={name:$('studentName').value,grades:get('grades'),tasks:get('tasks'),notes:localStorage.getItem(storageKey('notes'))};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='carteira_sabi.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
if(tab==='community'){if(!db){$('posts').textContent='Configura Firebase e as regras de segurança do Firestore para ativar a comunidade.';return}const posts=collection(db,'posts');$('postBtn').onclick=async()=>{if(!user)return;const text=$('postText').value.trim();if(!text)return;try{await addDoc(posts,{text,uid:user.uid,author:user.email,createdAt:serverTimestamp()});$('postText').value=''}catch(e){status(e.message)}};unsubscribe=onSnapshot(query(posts,orderBy('createdAt','desc'),limit(30)),snapshot=>{$('posts').replaceChildren();snapshot.forEach(doc=>{const p=document.createElement('article');p.textContent=`${doc.data().author||'Estudante'}: ${doc.data().text||''}`;$('posts').append(p)})},e=>status('Erro nas publicações: '+e.message))}}
function fill(id,items){const el=$(id);items.forEach(item=>{const [value,label]=Array.isArray(item)?item:[item,item];const o=document.createElement('option');o.value=value;o.textContent=label;el.append(o)})}function speak(t,lang='pt'){if(!('speechSynthesis'in window))return status('Voz indisponível.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang==='pt'?'pt-PT':lang;speechSynthesis.speak(u)}function quiz(root,s,count){const q=questions[s][0];const p=document.createElement('p');p.textContent=q[0];root.append(p);q[1].forEach((answer,i)=>{const b=document.createElement('button');b.textContent=answer;b.onclick=()=>{status((i===q[2]?'Correto! ':'Tenta novamente. ')+q[3])};root.append(b)})}
show('study');
</script></body></html>
